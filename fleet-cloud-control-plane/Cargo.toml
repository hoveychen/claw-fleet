[package]
name = "fleet-cloud-control-plane"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
fleet-cloud-wire = { path = "../fleet-cloud-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "uuid", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
