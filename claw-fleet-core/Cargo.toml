[package]
name = "claw-fleet-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tiny_http = "0.12"
percent-encoding = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
# Already in the dependency tree transitively; powers wiki export's
# store-only zip writer (stdlib has no zip; the full `zip` crate would be a
# genuinely new dependency for a 100MB-capped, no-compression use case).
crc32fast = "1"
sha2 = "0.10"
base64 = "0.22"
conch-parser = "0.1.1"
shell-words = "1.1.1"
ctrlc = { version = "3", features = ["termination"] }
git2 = { version = "0.18", default-features = false }
# Feishu WebSocket long-connection — hand-rolled minimal larkws client
# (outbound, no public webhook, works behind a firewall). Frame codec via the
# standalone, clean `lark-websocket-protobuf` crate (crates.io, no submodule
# baggage); connection / heartbeat / fragment-reassembly / dispatch are
# hand-written in feishu.rs.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
lark-websocket-protobuf = "0.1"
prost = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
serde_yaml = "0.9"
