[package]
name = "claw-fleet-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Read the user's `notify` out of codex's config.toml so the injected Fleet
# notify can chain-forward to it (see codex_launch::read_user_codex_notify).
# Already in the lockfile transitively; promoted to a direct dep here.
toml = "0.8"
dirs = "5"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tiny_http = "0.12"
percent-encoding = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }
# QR code for the mobile-web pairing URL (rendered as SVG in the 「移动端」
# view). Encoding the QR spec by hand is not realistic; svg-only keeps it light.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zstd = "0.13"
# Already in the dependency tree transitively; powers wiki export's
# store-only zip writer (stdlib has no zip; the full `zip` crate would be a
# genuinely new dependency for a 100MB-capped, no-compression use case).
crc32fast = "1"
sha2 = "0.10"
base64 = "0.22"
# End-to-end encryption of relay `msg` payloads (relay_crypto.rs). HKDF-SHA256
# derives a channel token + AES-256-GCM key from the pairing secret; the relay
# only ever sees the token and ciphertext. Both primitives are natively
# available in the mobile-web peer's WebCrypto, so the wire format interops
# with zero JS crypto dependency.
hkdf = "0.12"
aes-gcm = "0.10"
# gzip the mobile sessions snapshot before it crosses the relay (~110KB→29KB on
# weak links). The mobile client inflates with the native `DecompressionStream`.
flate2 = "1"
# Downscale oversized decision-asset images before they cross the relay so the
# mobile client can render them (the WS frame budget can't carry a full-res
# 3-5 MiB AI preview). png/jpeg decode + jpeg encode is all we need.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
conch-parser = "0.1.1"
shell-words = "1.1.1"
ctrlc = { version = "3", features = ["termination"] }
git2 = { version = "0.18", default-features = false }
# Outbound WebSocket long-connection for the mobile relay channel, and the
# `fleet acp --remote` stdio→cloud proxy.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# tokio-tungstenite's WebSocketStream *is* a futures Stream/Sink — `.split()`,
# `.next()` and `.send()` come from StreamExt/SinkExt, which neither std nor
# tokio provides. Same crate and version fleet-relay already builds against, so
# this adds nothing new to the lockfile.
futures-util = { version = "0.3", default-features = false }
# dsh stores its provider config (including which env var holds the OpenRouter
# key) as YAML. Already a production dependency of fleet-cli and already in the
# lockfile, so promoting it here from dev-dependencies adds no new crate — and
# hand-rolling a parser for nested YAML would be strictly worse.
serde_yaml = "0.9"

# Rust→TypeScript type generation. Optional + feature-gated so a normal `cargo
# build` never pulls the proc-macro: the `#[derive(TS)]` attrs are wrapped in
# `#[cfg_attr(feature = "ts-export", ...)]`, and bindings are (re)generated only
# by `cargo test --features ts-export` (the drift-guard). Keeps core's default
# build free of any codegen dependency.
ts-rs = { version = "12", features = ["serde-compat", "chrono-impl"], optional = true }

[features]
# Enables the ts-rs derives + `#[ts(export)]` binding generation. Off by default.
ts-export = ["dep:ts-rs"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Globalization", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
# Source-text parsing for the backend drift-guard test (tests/backend_drift_guard.rs).
# Already in the dependency tree transitively (v1.12.x via reqwest/sysinfo etc), so
# this adds no new download; used only by the guard to detect fan-out drift.
regex = "1"
