# ── Codex ───────────────────────────────────────────────────────────────────
# `ultra` = “最高推理强度，并自动委派任务”。只有部分模型有。
# label 用带版本号的全名（"GPT-5.6 Sol" 而非 "Sol"）：它同时是桌面与移动端模型
# 下拉里的那行字，光写 "Sol" 在下拉里认不出是哪一代。

[[model]]
id = "gpt-6-astra"
label = "GPT-6 Astra"
family = "codex"
tier = "premium"
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
