# ── dsh ─────────────────────────────────────────────────────────────────────
# 这里**不**试图列全 dsh 能跑的模型。dsh 的目录是每个用户 `~/.dsh/settings.yaml`
# 配出来的（本机是 2 个 DeepSeek 加 270 多个 openrouter 条目），而且 dsh 已经在
# 运行时把每个模型的真实 `efforts` 与 `defaultEffort` 发过线来。抄一份静态副本
# 只会过期，还会盖住那份活数据。
#
# 列出来的只有 `deepseek-official` 这一个 provider 的三个模型：它是 dsh 内置的
# 路由，全机器一致。openrouter 那 270 多个不列——逐用户配置不同，实测里它们的
# effort 梯子也五花八门（有的带 minimal，有的带 off，有的是空数组）。
#
# 三条的 `efforts` / `default_effort` 是**向本机 dsh 实测**来的，不是抄的：
# `dsh_source::dsh_models()` 返回的 `session/modelCatalog`（复现见该模块的
# `live_probe::dump_dsh_models`，2026-09-08 抓取）。三个 deepseek-official 模型
# 一致是 `off / low / high / max`，默认 `high`——**注意没有 `medium`**，这正是
# 凭印象绝对写不对的那种事实。
#
# 仍然不列 openrouter：实测里它那 270 多个模型的梯子五花八门（有的是
# `minimal/low/medium/high`，有的带 `off`，有的干脆是空数组），且逐用户配置不同。
# 没编目的 dsh 模型 `effort_ladder()` 返回 None，速查表显示「见 dsh」——那句话
# 现在只对它们成立。
#
# `context` 只填**实测到的**那两条。本机 dsh 会话里 dsh 自己上报的
# `contextPressure.contextWindow`：deepseek-v4-flash 与 -flash-vision-exp 各 18 / 8
# 个会话，一致报 1000000（同一批里经 dsh 走的 anthropic/claude-haiku-4.5 报
# 200000，与 Claude 真实窗口吻合，可作读数无误的旁证）。
# **deepseek-v4-pro 本机没有会话，所以留空、表里显示 `—`。**同族大概率也是 1M，
# 但「大概率」不是实测，宁可空着。哪天有一个 pro 会话跑过，就能照样填上。
#

[[model]]
id = "deepseek-official/deepseek-v4-pro"
label = "DeepSeek V4 Pro"
family = "dsh"
tier = "premium"
# 老板确认 Pro 也是 1M（本机没有它的会话可量，这一条的来源是人不是探针）。
context = 1000000
efforts = ["off", "low", "high", "max"]
default_effort = "high"

[[model]]
id = "deepseek-official/deepseek-v4-flash"
label = "DeepSeek V4 Flash"
family = "dsh"
tier = "standard"
efforts = ["off", "low", "high", "max"]
default_effort = "high"
context = 1000000

[[model]]
id = "deepseek-official/deepseek-v4-flash-vision-exp"
label = "DeepSeek V4 Flash (vision, exp)"
family = "dsh"
tier = "standard"
efforts = ["off", "low", "high", "max"]
default_effort = "high"
context = 1000000
