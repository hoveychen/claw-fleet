# Fleet 模型目录 —— 内置默认值
#
# 这份文件是 Fleet 对「每个模型收哪几档 effort、算哪个档位、怎么跟 agent 描述」
# 的单一真相源。它被 `include_str!` 编进二进制，所以每次 Fleet 升级都会带上更新
# 过的一份。
#
# 想在本机改而不等下一版 Fleet，就写 `~/.fleet/models.toml`：同 id 的条目按
# **字段级**覆盖这里的值（只写 `efforts` 就只改梯子，其余字段仍取本文件），
# 本文件没有的 id 则是新增。用户文件写坏了会被忽略并沿用内置值 —— 一份手滑的
# 覆盖不该让所有会话失去梯子信息。
#
# ── 字段 ──
#   id             模型 id。Claude 与 Codex 用裸 id；dsh 用 `provider/model` 全称。
#   label          速查表里显示的名字（"Fable 5.1" / "Sol"）。
#   family         claude-code | codex | dsh。留空则由 id 形状推断
#                  （见 agent_source::source_for_model）。
#   tier           fast | standard | premium。跨 harness 换算同档模型时用。
#   efforts        该模型接受的 effort，**从弱到强**排列。顺序是有意义的：
#                  把一个档位映射到不支持它的模型时要向下钳位，需要一个全序。
#   default_effort 不指定 effort 时该模型自己会落到哪一档。仅供展示与推理，
#                  Fleet 不会替 CLI 填这个值。
#   context        默认上下文窗口（token）。仅用作**回退**：会话自报了真实窗口
#                  就以自报为准（Codex 每轮都会自报）。
#   max_context    该模型能开到的最大窗口。目前只作记录，不参与百分比计算。
#   listed         false = 可解析但不进速查表（裸别名 `opus` 之类）。默认 true。
#   superseded_by  被哪个 id 取代。这种行不单独占一行，而是折进目标行末尾的
#                  「前代 X 同价仍可选」——那是三份 guidance 原本就用的体例。
#
# Claude 各条**故意不写 context**：窗口由家族规则判定（Opus/Sonnet 4.6+、5.x、
# Fable、Mythos 原生 1M，其余 200K），还要认 Fleet 自己的 `[1m]` 后缀和带日期的
# 别名——那是一条规则，不是一张能逐 id 列全的表。见 session/stats.rs。速查表要
# 显示窗口时就去调那条规则，而不是在这里抄一份可能对不上的副本。
#
# ── 事实来源 ──
# Codex 各条的 efforts / default_effort / context / max_context 读自
# `~/.codex/models_cache.json`（`supported_reasoning_levels`、`context_window`、
# `max_context_window`；client 0.153.4，2026-09-08 抓取），不是文档。这点很重要：
# 树里此前手写的几份副本都声称 Codex 顶到 `high` 且提供 `minimal`，而缓存显示每
# 个 listed 模型都支持 `xhigh`/`max`，且没有任何一个提供 `minimal`；它们还把
# Astra 写成 1.05M 上下文，实测是 272K 默认 / 872K 上限。
#
# dsh 是个例外，看文件末尾那一节。

# ── Claude ──────────────────────────────────────────────────────────────────
# 整个家族共用一条 `--effort` 梯子；default_effort 由 CLI 自己定，不在这里断言。
#
# 这里列的 id 与两个模型选择器（桌面 `CLAUDE_MODEL_CHOICES`、移动端
# `MODEL_CHOICES`）逐条对齐，前代一并列全，好让 tier 换算对每一个可选项都成立。
# 末尾四条是裸别名：`--model opus` 是合法写法，也该问得出档位，但不进速查表。
# Fleet 自己的 `[1m]` 上下文后缀不是模型 id 的一部分，查表前会被剥掉，所以
# `claude-opus-5[1m]` 命中的就是 `claude-opus-5` 这一行。

[[model]]
id = "claude-fable-5-1"
label = "Fable 5.1"
family = "claude-code"
tier = "premium"
efforts = ["low", "medium", "high", "xhigh", "max"]

[[model]]
id = "claude-fable-5"
label = "Fable 5"
family = "claude-code"
tier = "premium"
efforts = ["low", "medium", "high", "xhigh", "max"]
superseded_by = "claude-fable-5-1"
# 折进 5.1 那一行时附带的差异说明。
legacy_note_zh = "5.1 上强制 tool_choice `any`/`tool` 会 400，5 没这限制"
legacy_note_en = "forced `tool_choice` `any`/`tool` returns 400 on 5.1; 5 has no such restriction"

