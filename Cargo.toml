[workspace]
members = [
    "claw-fleet-core",
    "claw-fleet-desktop",
    "fleet-cli",
    "fleet-image",
    "fleet-hooks-server",
    "fleet-relay",
    "fleet-cloud-api",
    "fleet-runner",
]
resolver = "2"

[profile.release]
strip = true
lto = true

# A dev/debug build of the desktop app is a supported way to run Fleet, so the
# dev profile has to stay fast enough to serve the mobile relay — `tail` runs on
# the phone's 15s request timeout.
#
# The thing that timeout hinges on is one per-pixel loop over ~1.3M pixels: the
# transcript-thumbnail / decision-asset squeeze. Unoptimized it emits real calls
# for `f32::mul`, `Iter::next`, `u8::to_u8` and the `debug_assertions` bounds
# checks — they show up as stack *tops* in
# `~/.fleet/diagnostics/stall-1787969331067-tail.txt`, a live sample of a `tail`
# that took 44s on the phone and timed it out.
#
# Measured on that same transcript's 4 screenshots (780x1688), varying only the
# optimization level:
#
#   release (opt=3 + lto) ...................   848 ms
#   dev, own=2, deps=3 ...................... 1,791 ms
#   dev, own=1, deps=3 ...................... 2,685 ms
#   dev, own=0, deps=3 ..................... 14,354 ms
#   dev, all opt=0 (the old default) ....... 31,437 ms
#
# `own=0, deps=3` lands at 14s rather than 2.7s because `image`'s code is
# generic: it is monomorphized into whichever crate *calls* it and so compiles
# at that crate's opt-level, not at the dependency profile's. Raising
# `[profile.dev.package."*"]` alone can never reach it.
#
# For a long time the answer was `[profile.dev] opt-level = 1` — the whole
# workspace optimized so that one loop would be. That is a bad trade. Measured
# 2026-09-08 in one worktree, flipping only this value, with a unique source
# edit per run so sccache could not serve a hit:
#
#   compile claw-fleet-core from scratch .. 51.8s at opt=1 → 17.7s at opt=0
#   rebuild it after a one-line edit ......  8.1s at opt=1 →  3.1s at opt=0
#
# That was the cost on every crate, on every build, forever, for the benefit of
# a single function. `scripts/build-local.sh` is debug-profile only, so it pays
# it on every local app build too.
#
# The one thing opt=0 does cost is test *execution*: the same 2714-test
# claw-fleet-core lib suite runs in 91.4s at opt=0 vs 84.2s at opt=1 (+8.5%).
# It stays that small because `[profile.dev.package."*"]` keeps every dependency
# at 3 — only our own orchestration/IO code drops to 0, and the one tight loop
# we own is pinned below. The edit→test cycle is still far ahead: building that
# test binary goes 55.7s → 20.0s, so the round trip is 139.9s → 111.4s.
#
# So the loop now lives in its own crate, `fleet-image`, and only *it* is pinned
# to opt-level 3. `[profile.dev]` is back to the cargo default, which is what a
# debug build should be, and the phone path came out *faster* than it was under
# `opt-level = 1` (1.51s vs 1.68s on the same fixture) because the loop is now
# compiled at 3 rather than 1. `claw-fleet-core/tests/downscale_stays_optimized.rs`
# guards the pin — it fails if this section is dropped.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

# The pixel loop, monomorphized `image` code and all. This is the one workspace
# member that must not be a debug build — see above. Adding unrelated code to
# `fleet-image` silently opts it into release-grade optimization on every debug
# build, so keep that crate to the hot path.
[profile.dev.package.fleet-image]
opt-level = 3
