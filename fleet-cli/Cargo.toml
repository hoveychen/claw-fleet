[package]
name = "fleet-cli"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
claw-fleet-core = { path = "../claw-fleet-core" }
# fleet-task lifecycle runtime, folded in as the hidden `task-runtime`
# subcommand (the desktop spawns `fleet task-runtime resume` instead of a
# separate fleet-task binary).
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
tiny_http = "0.12"
percent-encoding = "2"
libc = "0.2"
ureq = { version = "2", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
# task-runtime TUI (picker / launchpad) — used only by task_runtime::tui.

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.18", default-features = false }
