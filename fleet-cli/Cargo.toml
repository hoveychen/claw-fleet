[package]
name = "fleet-cli"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# Compile the web UI bundle into the binary — see build.rs for why this is a
# feature rather than the default. Requires FLEET_WEBUI_DIR at build time.
embed-webui = []

[build-dependencies]
# Already in the tree via claw-fleet-core; used here to gzip the embedded
# bundle at build time.
flate2 = "1"

[dependencies]
claw-fleet-core = { path = "../claw-fleet-core" }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
tiny_http = "0.12"
percent-encoding = "2"
libc = "0.2"
ureq = { version = "2", default-features = false }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.18", default-features = false }
