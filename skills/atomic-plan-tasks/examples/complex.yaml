# Complex plan — mixed UI/backend with implicit shared file (App.tsx routes) and a human gate.
# Shape:
#   api-types ──► backend-impl ──► backend-tests ──►
#                                                    \
#   shared-routes ─► route-feature-a (humanGate) ────┤
#                  └► route-feature-b ───────────────┤── build-all ─► e2e
#   shared-i18n  ─► copy-feature-a ──────────────────┤
#                  └► copy-feature-b ────────────────┘
#
# Notes:
# - `shared-routes` and `shared-i18n` are dedicated P-items whose only job is to
#   edit a shared file (App.tsx, locales/*) once. Downstream P-items depend on them
#   instead of editing the shared file themselves — that avoids merge conflicts the
#   scheduler couldn't have predicted from `touches` overlap.
# - `route-feature-a` has `humanGate: true` because the layout is judgment-dependent.

plan:
  - id: api-types
    desc: "Add the Bookmarks type to the shared API contract crate."
    touches:
      - claw-fleet-core/src/api/bookmarks.rs
      - claw-fleet-core/src/api/mod.rs
    dependsOn: []
    estimateSecs: 600
    acceptance:
      - builds
      - testsPass: "cargo test -p claw-fleet-core api::bookmarks"
    artifacts:
      - fileList
      - gitDiff

  - id: backend-impl
    desc: "Implement the bookmarks CRUD endpoints + persistence."
    touches:
      - claw-fleet-core/src/api/bookmarks_handlers.rs
      - claw-fleet-core/src/db/bookmarks.rs
    dependsOn: [api-types]
    estimateSecs: 1800
    acceptance:
      - builds
      - testsPass: "cargo test -p claw-fleet-core bookmarks_handlers"
    artifacts:
      - fileList
      - gitDiff
      - testOutput

  - id: backend-tests
    desc: "Add integration tests for the bookmarks endpoints."
    touches:
      - claw-fleet-core/tests/bookmarks_integration.rs
    dependsOn: [backend-impl]
    estimateSecs: 900
    acceptance:
      - testsPass: "cargo test -p claw-fleet-core --test bookmarks_integration"
    artifacts:
      - testOutput

  - id: shared-routes
    desc: "Register two new bookmark routes in App.tsx. Downstream UI P-items only edit their own components."
    touches:
      - claw-fleet-desktop/src-ui/src/App.tsx
    dependsOn: [api-types]
    estimateSecs: 300
    acceptance:
      - builds
    artifacts:
      - fileList
      - gitDiff

  - id: shared-i18n
    desc: "Add bookmark UI strings to zh-CN and en locale files. Downstream P-items reference these keys but don't edit the files."
    touches:
      - claw-fleet-desktop/src-ui/src/locales/en.json
      - claw-fleet-desktop/src-ui/src/locales/zh-CN.json
    dependsOn: []
    estimateSecs: 300
    acceptance:
      - builds
    artifacts:
      - fileList
      - gitDiff

  - id: route-feature-a
    desc: "Build the BookmarkList page (table view, no editing)."
    touches:
      - claw-fleet-desktop/src-ui/src/views/BookmarkList.tsx
      - claw-fleet-desktop/src-ui/src/views/BookmarkList.module.css
    dependsOn: [shared-routes, shared-i18n, backend-impl]
    estimateSecs: 1500
    acceptance:
      - builds
      - humanReview
    humanGate: true
    artifacts:
      - fileList
      - gitDiff

  - id: route-feature-b
    desc: "Build the BookmarkEdit dialog."
    touches:
      - claw-fleet-desktop/src-ui/src/dialogs/BookmarkEdit.tsx
      - claw-fleet-desktop/src-ui/src/dialogs/BookmarkEdit.module.css
    dependsOn: [shared-routes, shared-i18n, backend-impl]
    estimateSecs: 1500
    acceptance:
      - builds
      - humanReview
    humanGate: true
    artifacts:
      - fileList
      - gitDiff

  - id: copy-feature-a
    desc: "Wire BookmarkList strings to i18n keys + add empty-state copy."
    touches:
      - claw-fleet-desktop/src-ui/src/views/BookmarkList.tsx
    dependsOn: [route-feature-a, shared-i18n]
    estimateSecs: 300
    acceptance:
      - builds

  - id: copy-feature-b
    desc: "Wire BookmarkEdit strings to i18n keys + validation messages."
    touches:
      - claw-fleet-desktop/src-ui/src/dialogs/BookmarkEdit.tsx
    dependsOn: [route-feature-b, shared-i18n]
    estimateSecs: 300
    acceptance:
      - builds

  - id: build-all
    desc: "Workspace build + frontend build."
    touches: []
    dependsOn: [backend-tests, copy-feature-a, copy-feature-b]
    resources: [build]
    acceptance:
      - builds
      - custom: "frontend `pnpm build` exits 0"

  - id: e2e
    desc: "Playwright smoke: create a bookmark, edit it, delete it."
    touches:
      - claw-fleet-desktop/e2e/bookmarks.spec.ts
    dependsOn: [build-all]
    resources: [test, "port:3000"]
    skippable:
      noChangesIn:
        - claw-fleet-core/src/api/bookmarks.rs
        - claw-fleet-core/src/api/bookmarks_handlers.rs
    estimateSecs: 600
    acceptance:
      - testsPass: "pnpm playwright test e2e/bookmarks.spec.ts"
    artifacts:
      - testOutput
