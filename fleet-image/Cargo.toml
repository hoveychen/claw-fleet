[package]
name = "fleet-image"
version = "0.0.0"
edition = "2021"
publish = false

# This crate exists to be *small* and *optimized*. It holds the one per-pixel
# loop in Fleet (decode → resize → JPEG-encode) that a debug build cannot afford
# to leave unoptimized, so the workspace root pins it to `opt-level = 3` in the
# dev profile while everything else stays at 0. Keep it that way: every symbol
# added here is compiled at release-grade optimization on every debug build, so
# only genuinely hot pixel work belongs in it.
[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
