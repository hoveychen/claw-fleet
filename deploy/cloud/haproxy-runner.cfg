global
  log stdout format raw local0

defaults
  log global
  mode tcp
  timeout connect 10s
  timeout client 1h
  timeout server 1h

frontend runner_mtls
  bind :443
  default_backend runner_gateway

backend runner_gateway
  server control_plane "$FLEET_CONTROL_PLANE_HOST:$FLEET_CONTROL_PLANE_RUNNER_PORT" check
