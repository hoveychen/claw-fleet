apply plugin: 'com.android.application'

android {
    namespace = "com.hoveychen.clawfleet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hoveychen.clawfleet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Injected by scripts/build-android-apk.sh so every distributed APK
        // carries an identifiable version. The literals below are the fallback
        // for a bare `./gradlew assembleRelease` / Android Studio run.
        //
        // versionCode must increase monotonically or Android refuses to install
        // the newer APK over the older one ("app not installed" with no further
        // explanation), so the script derives it from the commit count rather
        // than from the human-facing versionName.
        versionCode System.getenv("FLEET_VERSION_CODE") ? System.getenv("FLEET_VERSION_CODE").toInteger() : 1
        versionName System.getenv("FLEET_VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes from the environment, never from a file in the repo:
    // the keystore and its password live in .signing/ (gitignored) and the app's
    // SHA-256 is what Push Kit and the App Link verifier check, so leaking it
    // would let anyone ship a build that impersonates this one.
    //
    // Unset env → no signingConfig, and `assembleRelease` produces an unsigned
    // APK instead of failing the whole build (debug builds are unaffected).
    //   FLEET_KEYSTORE_PATH=/abs/path/fleet-release.jks
    //   FLEET_KEYSTORE_PASSWORD=…      (store and key password are the same)
    def keystorePath = System.getenv("FLEET_KEYSTORE_PATH")
    def keystorePassword = System.getenv("FLEET_KEYSTORE_PASSWORD")
    def canSignRelease = keystorePath && keystorePassword && file(keystorePath).exists()

    if (canSignRelease) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias "fleet"
                keyPassword keystorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
