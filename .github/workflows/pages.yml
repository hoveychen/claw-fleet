name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          # sitemap_lastmod.py dates each page from its own last commit, and a
          # shallow clone reports HEAD for every file -- which would stamp
          # "changed just now" onto all four pages.
          fetch-depth: 0
      - name: Build latest stable download manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/site/pages_manifest.py
          --mirror-url https://fleet.eternizedlab.com/downloads.json
          --output docs/downloads.json
      - name: Stamp real lastmod dates into the sitemap
        run: python3 scripts/site/sitemap_lastmod.py
      # docs/ also holds design notes, product research and the mirror's
      # systemd units. Staging picks only the files that are part of the site
      # and resolves __SITE_ORIGIN__ to this deployment's own origin, so the
      # canonical, hreflang and sitemap URLs point at Pages rather than at the
      # China mirror.
      - name: Stage the published site
        run: >-
          python3 scripts/site/stage_pages.py
          --output "$RUNNER_TEMP/pages"
          --origin https://hoveychen.github.io/claw-fleet
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages
      - id: deployment
        uses: actions/deploy-pages@v4
