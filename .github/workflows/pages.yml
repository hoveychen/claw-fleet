name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read enabled China download manifest
        if: vars.CHINA_DISTRIBUTION_ENABLED == 'true'
        env:
          COS_PUBLIC_URL: ${{ vars.COS_PUBLIC_URL }}
        run: |
          python3 - <<'PYTHON'
          import json, os, urllib.request
          from pathlib import Path
          from scripts.site.distribute import validate_base_url, REQUIRED
          try:
              base = validate_base_url(os.environ['COS_PUBLIC_URL'])
              with urllib.request.urlopen(base + '/downloads.json', timeout=20) as response:
                  manifest = json.load(response)
              assert manifest['schema'] == 1 and isinstance(manifest['version'], str)
              assets = manifest['china']['assets']
              assert REQUIRED <= assets.keys()
              for name, asset in assets.items():
                  assert asset['url'].startswith(base + '/releases/' + manifest['version'] + '/')
              Path('docs/downloads.json').write_text(json.dumps(manifest))
          except Exception as error:
              print('China manifest unavailable; keeping GitHub downloads:', type(error).__name__)
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
