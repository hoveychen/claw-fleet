name: Relay Image

# Builds the fleet-relay container (relay binary + mobile-web bundle) and pushes
# it to GHCR, so muvee pulls a pre-built image instead of compiling from source.
#
# The muvee "fleet-relay" project is (or should be) an image-type project pointed
# at ghcr.io/hoveychen/fleet-relay:latest with auto-deploy on; it redeploys when
# this workflow repushes the :latest digest.

on:
  push:
    branches: [main]
    paths:
      - 'fleet-relay/**'
      - 'mobile-web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/relay-image.yml'
  workflow_dispatch:

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hoveychen/fleet-relay

jobs:
  build-push:
    name: Build & push relay image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Build context is the repo root: fleet-relay/Dockerfile COPYs the
      # workspace Cargo.toml/Cargo.lock and the mobile-web/ tree from there.
      # linux/amd64 only — muvee deploy nodes run amd64.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fleet-relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
