name: Relay Image

# Builds the fleet-relay container (relay binary + mobile-web bundle) and pushes
# it to GHCR, so muvee pulls a pre-built image instead of compiling from source.
#
# The muvee "fleet-relay" project is (or should be) an image-type project pointed
# at ghcr.io/hoveychen/fleet-relay:latest with auto-deploy on; it redeploys when
# this workflow repushes the :latest digest.

on:
  push:
    branches: [main]
    paths:
      - 'fleet-relay/**'
      - 'mobile-web/**'
      # The native shell projects ship no code into this image (.dockerignore
      # drops them from the build context), so a change there must not spend a
      # full relay rebuild. Order matters: these negations follow the broad
      # mobile-web/** glob they carve out of.
      - '!mobile-web/android/**'
      - '!mobile-web/ios/**'
      # 仓库根的跨包共享 TS：mobile-web 直接 import 它，改了必须重建 bundle。
      - 'shared-ts/**'
      # 同理，第二处跨包 import：mock 模式的官网场景数据（见 src/mock/relay.ts）。
      # 它是构建输入而不只是官网素材，漏掉这条的后果和上面两类一样——改了 fixtures
      # 的那次推送 CI 全绿、没有镜像、线上还是旧 bundle。
      - 'scripts/site/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/relay-image.yml'
  workflow_dispatch:

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hoveychen/fleet-relay

jobs:
  build-push:
    name: Build & push relay image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # Build context is the repo root: fleet-relay/Dockerfile COPYs the
      # workspace Cargo.toml/Cargo.lock and the mobile-web/ tree from there.
      # linux/amd64 only — muvee deploy nodes run amd64.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fleet-relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the built mobile-web bundle with this commit so the desktop can
          # flag a phone running an outdated deploy (see mobile-web vite.config.ts
          # __APP_COMMIT__). `.git` isn't in the Docker context, so pass it in.
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
