name: Cloud Image

# Builds the Fleet Cloud (lean) container — fleet CLI + claude/codex CLIs +
# the foxy-switcher cred-store agent — and pushes it to GHCR, so muvee pulls a
# pre-built image instead of compiling Rust on a deploy node.
#
# The muvee "fleet-cloud" project is an image-type project pointed at this
# repository package. main pushes :latest; a prd/fleet-cloud-** branch pushes
# :preview, so a deployment can be verified against the real vault before the
# branch merges (GitHub only offers workflow_dispatch for workflows that already
# live on the default branch, which a brand-new branch cannot use).

on:
  push:
    branches:
      - main
      # Preview builds for cloud work. Both prefixes are listed because the
      # plans that touch this image have used both (`fleet-cloud-…` for the
      # deployment itself, `cloud-…` for the API surface) — a branch that misses
      # the filter looks like a green push with no image behind it.
      - 'prd/fleet-cloud-**'
      - 'prd/cloud-**'
    # 发版 tag 也要重建镜像。没有这一条时，链路是：合入 main → 本 workflow 立刻
    # 跑，此刻 `git describe` 只看得到**上一个** tag → 烧出 `2.6.x-dev`；随后人手
    # 推 `v2.7.x` tag 只触发 CI/Release，云镜像纹丝不动。结果不是偶发竞态，而是
    # 只要 tag 打在 main HEAD 上，云端报的版本串就恒定滞后一个 tag（2026-09-09
    # 实测：线上 commit 已是 main HEAD，version 却还是 `2.7.0-dev`，而 HEAD 上
    # 挂着 v2.7.1）。tag 推送时 GitHub **不评估 paths 过滤器**，所以这一条落在同
    # 一个 `push:` 下不会被下面的 paths 吃掉——tag 一律重建。
    tags:
      - 'v*'
    paths:
      - 'deploy/lean/**'
      - 'claw-fleet-core/**'
      - 'fleet-cli/**'
      - 'fleet-hooks-server/**'
      # The image's webui stage builds this crate's frontend, which is what
      # `fleet webui` serves. Without it here a pure-frontend change ships
      # nothing: CI stays green, no image is built, and the deployed UI is
      # silently the previous one.
      - 'claw-fleet-desktop/**'
      # 同上，另一份前端：镜像的 mobileweb 阶段 `pnpm build:webui` 出的产物就是
      # 手机访问这个容器时看到的 `/m/`。漏掉它的后果和上面一模一样——只改移动端
      # 的那次推送 CI 全绿、没有镜像、线上还是旧的。
      - 'mobile-web/**'
      # 两份前端各自 import 的仓库根源码，它们同样是镜像的构建输入：shared-ts/ 被两个
      # 前端直接 import，scripts/site/fixtures/ 是 mock 模式的官网场景数据（见
      # app/mock/website.ts 与 src/mock/relay.ts）。漏掉的后果和上面两条一样。
      - 'shared-ts/**'
      - 'scripts/site/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/cloud-image.yml'
  workflow_dispatch:

concurrency:
  group: cloud-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/hoveychen/fleet-cloud

jobs:
  build-push:
    name: Build & push cloud image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        # fetch-depth 0 for the tags: the version this image reports is derived
        # from the nearest tag (see the step below), and a shallow clone has
        # none, which would silently degrade every image to "0.0.0-dev".
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The version string the container reports on /health and shows in the
      # browser build's settings. Only the release workflow rewrites the crate
      # versions from a tag, so this image would otherwise compile as 0.0.0.
      #
      # Two cases, and the distinction matters:
      #   - HEAD *is* a tag (the release build, triggered by the tag push above)
      #     → report the tag verbatim, `2.7.1`. Appending `-dev` here would have
      #     the released image deny being the release it literally is.
      #   - HEAD is past the last tag (an ordinary main push) → `2.7.1-dev`,
      #     which places the build without claiming to be that release.
      # No tag reachable (a fresh fork, a branch cut before any tag) →
      # `0.0.0-dev`, which is exactly as informative as the tag-less truth.
      - name: Derive version string
        id: ver
        shell: bash
        run: |
          EXACT="$(git describe --tags --exact-match 2>/dev/null || true)"
          if [ -n "$EXACT" ]; then
            VERSION="${EXACT#v}"
          else
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            TAG="${TAG:-v0.0.0}"
            VERSION="${TAG#v}-dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # A tag ref must land on `:latest` too — it is the same tree as the
          # main push that preceded it, only with a correct version string. The
          # old `enable={{is_default_branch}}` is false for a tag ref, and the
          # old preview condition (`ref_name != default_branch`) is true for it,
          # so a tag build would have quietly published itself as `:preview` and
          # left `:latest` on the `-dev` image forever. Both conditions are now
          # spelled out against `github.ref` instead of `ref_name`.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=preview,enable=${{ startsWith(github.ref, 'refs/heads/prd/') }}
            type=sha,format=long

      # Build context is the repo root: deploy/lean/Dockerfile compiles
      # fleet-cli from the workspace. linux/amd64 only — muvee deploy nodes run
      # amd64, and the foxy-switcher stage is pulled for the same platform.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/lean/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The commit this image is built from, twice over: `.git` is not in
          # the build context, so neither `build.rs` nor vite can read it.
          # FLEET_GIT_COMMIT lands as a runtime ENV (reported by `/health`, shown
          # in the browser build's settings); APP_COMMIT is baked into the mobile
          # bundle's __APP_COMMIT__ (shown on its 关于 page). Absent → both read
          # "unknown" and the rows hide.
          build-args: |
            FLEET_GIT_COMMIT=${{ github.sha }}
            APP_COMMIT=${{ github.sha }}
            FLEET_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
