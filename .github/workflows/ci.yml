name: CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Non-tag push / PR — quick single-platform test only. Saves Actions usage by
  # skipping the multi-platform CLI + desktop bundles below until a release tag.
  #
  # This is the ONLY place unit tests run. A release tag is always cut from a
  # commit that already passed this job on push, so the tag-time jobs below
  # deliberately skip tests to avoid recompiling the whole workspace in release
  # mode on four platforms just to re-run the same suite.
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    name: Test (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --release -p fleet-cli -p claw-fleet-core -p claw-fleet-task -p fleet-task

  # ═══════════════════════════════════════════════════════════════════════════
  # Tag push only — Linux CLI binaries.
  #
  # These two artifacts serve double duty: they are the standalone Linux CLI
  # release downloads AND the `fleet` probes that every desktop bundle (macOS,
  # Windows, Linux) embeds as resources for remote SSH deployment. They are the
  # only cross-platform binaries the desktop jobs cannot produce on their own
  # runner, so they live in this small, fast (zigbuild, no tests) job that the
  # desktop matrix depends on.
  # ═══════════════════════════════════════════════════════════════════════════
  cli-linux:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    name: CLI — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            artifact: fleet-linux-x64

          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            artifact: fleet-linux-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for toml in claw-fleet-core/Cargo.toml claw-fleet-desktop/Cargo.toml fleet-cli/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "$toml"
            rm -f "${toml}.bak"
          done

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build fleet-cli
        shell: bash
        run: |
          mkdir -p dist
          cargo zigbuild --release -p fleet-cli --target ${{ matrix.rust_target }}.2.17
          cp target/${{ matrix.rust_target }}/release/fleet-cli dist/${{ matrix.artifact }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Tag push only — per-platform desktop bundle (unsigned).
  #
  # Each job builds its OWN-platform `fleet` sidecar CLI and the Tauri app in a
  # single runner, so the shared `target/` directory lets cargo reuse the
  # compiled `claw-fleet-core` and dependency tree between the two builds
  # instead of recompiling the whole workspace in a separate CLI job. The macOS
  # and Windows jobs also upload their sidecar as the standalone CLI release
  # artifact (fleet-macos / fleet-windows-x64). The Linux job reuses the
  # cli-linux x64 probe as its sidecar, so it never compiles fleet-cli twice.
  #
  # Tag-time signing (macOS) and publishing happen in release.yml, which
  # downloads these artifacts.
  # ═══════════════════════════════════════════════════════════════════════════
  desktop-build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: cli-linux
    name: Desktop — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            runner: macos-latest
            rust_target: universal-apple-darwin
            tauri_args: --target universal-apple-darwin --features vendored-ssl
            sidecar_name: fleet-universal-apple-darwin
            cli_artifact: fleet-macos
            fixed_suffix: macos
            build_sidecar: true
            cache_key: desktop-macos

          - name: Windows (x64)
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
            sidecar_name: fleet-x86_64-pc-windows-msvc.exe
            cli_artifact: fleet-windows-x64
            fixed_suffix: windows-x64
            build_sidecar: true
            cache_key: desktop-windows-x64

          - name: Linux (x86_64)
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu
            sidecar_name: fleet-x86_64-unknown-linux-gnu
            cli_artifact: ''
            fixed_suffix: linux-x64
            build_sidecar: false
            cache_key: desktop-linux-x64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for toml in claw-fleet-core/Cargo.toml claw-fleet-desktop/Cargo.toml fleet-cli/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "$toml"
            rm -f "${toml}.bak"
          done

      # ── Toolchains ────────────────────────────────────────────────────────

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: claw-fleet-desktop/pnpm-lock.yaml

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # shared-key (not the per-job id) so the cache-warm job on main and
          # this tag-time job read/write the same key. GHA caches are scoped to
          # the creating ref + the default branch; since desktop builds only run
          # on tags, the warm cache populated on main is the only one a release
          # can restore. See the cache-warm job below.
          shared-key: ${{ matrix.cache_key }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            xdg-utils

      # ── Build own-platform sidecar CLI (macOS / Windows) ──────────────────
      # Runs before the Tauri build so the shared target/ dir warms core for it.

      - name: Build sidecar CLI (macOS universal)
        if: matrix.build_sidecar && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p claw-fleet-desktop/binaries dist
          cargo build --release -p fleet-cli --target aarch64-apple-darwin
          cargo build --release -p fleet-cli --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/fleet-cli \
            target/x86_64-apple-darwin/release/fleet-cli \
            -output "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}"
          chmod +x "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}"
          # tauri-action's universal build looks here for the lipo'd CLI too.
          mkdir -p target/universal-apple-darwin/release
          cp "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}" target/universal-apple-darwin/release/fleet-cli
          # Standalone CLI release artifact.
          cp "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}" "dist/${{ matrix.cli_artifact }}"

      - name: Build sidecar CLI (Windows)
        if: matrix.build_sidecar && runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p claw-fleet-desktop/binaries dist
          cargo build --release -p fleet-cli --target ${{ matrix.rust_target }}
          cp "target/${{ matrix.rust_target }}/release/fleet-cli.exe" \
             "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}"
          cp "target/${{ matrix.rust_target }}/release/fleet-cli.exe" \
             "dist/${{ matrix.cli_artifact }}.exe"

      - name: Upload standalone CLI artifact
        if: matrix.build_sidecar
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/
          if-no-files-found: error

      # ── Download cross-platform binaries from cli-linux ───────────────────

      - name: Download Linux x64 probe
        uses: actions/download-artifact@v8
        with:
          name: fleet-linux-x64
          path: claw-fleet-desktop/resources

      - name: Download Linux arm64 probe
        uses: actions/download-artifact@v8
        with:
          name: fleet-linux-arm64
          path: claw-fleet-desktop/resources

      - name: Download Linux sidecar
        if: '!matrix.build_sidecar'
        uses: actions/download-artifact@v8
        with:
          name: fleet-linux-x64
          path: claw-fleet-desktop/binaries

      - name: Prepare sidecar and probes
        shell: bash
        run: |
          cd claw-fleet-desktop/binaries
          # Linux job downloads its sidecar (named fleet-linux-x64) and renames
          # it; macOS/Windows already placed the sidecar in the build step above.
          if [ "${{ matrix.build_sidecar }}" != "true" ]; then
            mv fleet-linux-x64* "${{ matrix.sidecar_name }}"
            chmod +x "${{ matrix.sidecar_name }}"
          fi
          chmod +x "${{ matrix.sidecar_name }}" 2>/dev/null || true

          if [ "$RUNNER_OS" = "Linux" ]; then
            cp "${{ matrix.sidecar_name }}" fleet-linux
          fi

          cd ../resources
          chmod +x fleet-linux-x64 fleet-linux-arm64

      # ── Build desktop app (unsigned) ──────────────────────────────────────

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: claw-fleet-desktop

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ''
          OPENSSL_STATIC: '1'
        with:
          projectPath: claw-fleet-desktop
          args: ${{ matrix.tauri_args }}
          includeUpdaterJson: false

      # ── Collect unsigned artifacts ────────────────────────────────────────

      - name: Collect macOS .app (unsigned)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Tar to preserve permissions and symlinks across artifact transit.
          (cd "target/${{ matrix.rust_target }}/release/bundle/macos" && \
            tar -czf - "Claw Fleet.app") > "dist-artifacts/claw-fleet-${{ matrix.fixed_suffix }}.app.tar.gz"

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target/${{ matrix.rust_target }}/release/bundle/nsis \
            -name "*.exe" | head -1 | xargs -I{} cp {} dist-artifacts/claw-fleet-${{ matrix.fixed_suffix }}-setup.exe

      - name: Collect Linux bundles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target/${{ matrix.rust_target }}/release/bundle/deb \
            -name "*.deb" | head -1 | xargs -I{} cp {} dist-artifacts/claw-fleet-${{ matrix.fixed_suffix }}.deb 2>/dev/null || true
          find target/${{ matrix.rust_target }}/release/bundle/appimage \
            -name "*.AppImage" | head -1 | xargs -I{} cp {} dist-artifacts/claw-fleet-${{ matrix.fixed_suffix }}.AppImage 2>/dev/null || true

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.fixed_suffix == 'macos' && 'desktop-macos-unsigned' || format('desktop-{0}', matrix.fixed_suffix) }}
          path: dist-artifacts/
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # main-branch only — warm the desktop Rust cache.
  #
  # The tag-time desktop-build jobs above otherwise run with a stone-cold cache:
  # GitHub Actions caches are readable only from the creating ref + the default
  # branch, and desktop-build runs *only* on tags, so each release recompiles
  # the entire dependency tree from scratch (~15 min of a ~22 min macOS build —
  # the workspace crates themselves are only ~2 min; the rest is deps).
  #
  # This job runs on main, compiles the same crates/targets/features with the
  # same env, and saves a Swatinem cache under the same `shared-key` the
  # desktop-build jobs restore from. A release tag cut from that main commit
  # then hits a warm dependency cache. It only does the expensive compile when
  # the dependency set (Cargo.lock / any Cargo.toml) changed, since that is the
  # only thing the cache preserves across the workspace recompile a tag does.
  #
  # NOTE: GHA evicts caches unused for 7 days. If no dependency change lands for
  # a week, the next release falls back to a cold build until the following dep
  # change re-warms it. Add a scheduled keep-alive trigger if that becomes a
  # problem.
  # ═══════════════════════════════════════════════════════════════════════════
  cache-warm:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Warm cache — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            cache_key: desktop-macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            build: |
              cargo build --release -p fleet-cli --target aarch64-apple-darwin
              cargo build --release -p fleet-cli --target x86_64-apple-darwin
              OPENSSL_STATIC=1 cargo build --release -p claw-fleet-desktop --features vendored-ssl --target aarch64-apple-darwin
              OPENSSL_STATIC=1 cargo build --release -p claw-fleet-desktop --features vendored-ssl --target x86_64-apple-darwin

          - name: Windows (x64)
            runner: windows-latest
            cache_key: desktop-windows-x64
            targets: x86_64-pc-windows-msvc
            build: |
              cargo build --release -p fleet-cli --target x86_64-pc-windows-msvc
              cargo build --release -p claw-fleet-desktop --target x86_64-pc-windows-msvc

          - name: Linux (x86_64)
            runner: ubuntu-22.04
            cache_key: desktop-linux-x64
            targets: x86_64-unknown-linux-gnu
            build: |
              cargo build --release -p claw-fleet-desktop --target x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect dependency changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deps:
              - '**/Cargo.lock'
              - '**/Cargo.toml'

      - name: Setup pnpm
        if: steps.filter.outputs.deps == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.filter.outputs.deps == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: claw-fleet-desktop/pnpm-lock.yaml

      - name: Setup protoc
        if: steps.filter.outputs.deps == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        if: steps.filter.outputs.deps == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust
        if: steps.filter.outputs.deps == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache_key }}
          # Save on main even though cargo exits "successful with nothing to do"
          # on a warm cache — this also refreshes the cache's 7-day TTL.
          save-if: true

      - name: Install Linux dependencies
        if: steps.filter.outputs.deps == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            xdg-utils

      # claw-fleet-desktop's tauri build script requires the frontend dist to
      # exist (frontendDist: ./dist), so build it before compiling the crate.
      - name: Build frontend
        if: steps.filter.outputs.deps == 'true'
        working-directory: claw-fleet-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Warm dependency compilation
        if: steps.filter.outputs.deps == 'true'
        shell: bash
        run: |
          ${{ matrix.build }}
