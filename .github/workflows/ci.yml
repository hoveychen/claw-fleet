name: CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  # Manual trigger — primes / refreshes the desktop cache (cache-warm job)
  # without waiting for a dependency change to land on main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Non-tag push / PR — quick single-platform test only. Saves Actions usage by
  # skipping the multi-platform CLI + desktop bundles below until a release tag.
  #
  # This is the ONLY place unit tests run. A release tag is always cut from a
  # commit that already passed this job on push, so the tag-time jobs below
  # deliberately skip tests to avoid recompiling the whole workspace in release
  # mode on four platforms just to re-run the same suite.
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    name: Test (Linux x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --release -p fleet-cli -p claw-fleet-core -p fleet-hooks-server

      # Drift-guard: regenerate the Rust→TS bindings and fail if the committed
      # copies are stale. A Rust wire struct changed without re-running the
      # generator (or a hand edit to a generated file) shows up as a git diff.
      - name: TS bindings drift-guard
        run: |
          cargo test -p claw-fleet-core --features ts-export --test ts_export
          git diff --exit-code -- \
            claw-fleet-desktop/app/generated/types.ts \
            mobile-web/src/generated/types.ts \
          || { echo "::error::Generated TS bindings are stale. Run: cargo test -p claw-fleet-core --features ts-export --test ts_export"; exit 1; }

  # ═══════════════════════════════════════════════════════════════════════════
  # mobile-web 的类型检查与单测。
  #
  # 在此之前这个包的 tsc 只在 cloud image 的 Dockerfile 里跑过（`build:webui`
  # 的第一步）。后果实测过一次：一个测试文件里的 TS2493 一路溜到镜像构建才炸
  # —— 那是整条链上最慢、最贵、最晚的地方，而且它红了就意味着云端拿不到新镜像，
  # 线上还是旧版本。类型错误应该在推送后几十秒内红，不是几分钟后在 buildx 里红。
  #
  # 不含 vite build：产物构建由 cloud image 那边负责，这里只要最快的那道门。
  # ═══════════════════════════════════════════════════════════════════════════
  mobile-web:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    name: mobile-web (tsc + vitest)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        run: corepack enable

      - name: Install
        working-directory: mobile-web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: mobile-web
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        working-directory: mobile-web
        run: pnpm exec vitest run

  # ═══════════════════════════════════════════════════════════════════════════
  # Lint every tracked shell script. shellcheck ships pre-installed on the
  # ubuntu runner, so this is a seconds-long, Rust-free job. Discovering scripts
  # via `git ls-files '*.sh'` auto-covers new scripts without editing this list.
  # ═══════════════════════════════════════════════════════════════════════════
  shellcheck:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    name: ShellCheck
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run ShellCheck on tracked shell scripts
        run: git ls-files '*.sh' | xargs -r shellcheck

  # ═══════════════════════════════════════════════════════════════════════════
  # Tag push only — Linux CLI binaries.
  #
  # These two artifacts serve triple duty: they are the standalone Linux CLI
  # release downloads (the half of the Linux story that runs `fleet webui`),
  # AND the `fleet` probes that every desktop bundle (macOS, Windows) embeds as
  # resources for remote SSH deployment. They are the only cross-platform
  # binaries the desktop jobs cannot produce on their own runner, so they live
  # in this small, fast (zigbuild, no tests) job that the desktop matrix
  # depends on.
  # ═══════════════════════════════════════════════════════════════════════════
  cli-linux:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    name: CLI — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            artifact: fleet-linux-x64

          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            artifact: fleet-linux-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for toml in claw-fleet-core/Cargo.toml claw-fleet-desktop/Cargo.toml fleet-cli/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "$toml"
            rm -f "${toml}.bak"
          done

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Setup protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build fleet-cli
        shell: bash
        run: |
          mkdir -p dist
          cargo zigbuild --release -p fleet-cli --target ${{ matrix.rust_target }}.2.17
          cp target/${{ matrix.rust_target }}/release/fleet-cli dist/${{ matrix.artifact }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Tag push only — the browser build of the UI, shipped as a release tarball.
  #
  # This is what Linux users get instead of a desktop bundle: the same `vite
  # build` output the Tauri app embeds, served by `fleet webui --web-root`.
  # There is no Tauri/GTK/WebKitGTK build on Linux at all any more — one Node
  # job produces a platform-independent bundle that pairs with the fleet-linux-*
  # CLI binaries from `cli-linux` above.
  #
  # Two frontends go in: the desktop UI at the root (what a browser loads) and
  # the mobile UI under `m/`, exactly the layout deploy/lean/Dockerfile builds —
  # the desktop index.html redirects phones to `/m/`, and web_assets maps that
  # subdirectory with no extra route.
  # ═══════════════════════════════════════════════════════════════════════════
  webui-bundle:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    name: Web UI bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build desktop frontend (browser build)
        working-directory: claw-fleet-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build mobile frontend (same-origin webui mode)
        working-directory: mobile-web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:webui

      - name: Assemble bundle
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cp -R claw-fleet-desktop/dist claw-fleet-webui
          cp -R mobile-web/dist-webui claw-fleet-webui/m
          tar -czf dist-artifacts/claw-fleet-webui.tar.gz claw-fleet-webui

      - name: Upload web UI bundle
        uses: actions/upload-artifact@v7
        with:
          name: webui-bundle
          path: dist-artifacts/
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Tag push only — per-platform desktop bundle (unsigned).
  #
  # Each job builds its OWN-platform `fleet` sidecar CLI and the Tauri app in a
  # single runner, so the shared `target/` directory lets cargo reuse the
  # compiled `claw-fleet-core` and dependency tree between the two builds
  # instead of recompiling the whole workspace in a separate CLI job. Both jobs
  # also upload their sidecar as the standalone CLI release artifact
  # (fleet-macos / fleet-windows-x64).
  #
  # macOS and Windows only — Linux ships the CLI plus the webui-bundle above.
  # The cli-linux dependency stays: every desktop bundle embeds the Linux CLI
  # binaries as resources for remote SSH deployment.
  #
  # Tag-time signing (macOS) and publishing happen in release.yml, which
  # downloads these artifacts.
  # ═══════════════════════════════════════════════════════════════════════════
  desktop-build:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: cli-linux
    name: Desktop — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Universal)
            runner: macos-latest
            rust_target: universal-apple-darwin
            tauri_args: --target universal-apple-darwin --features vendored-ssl
            sidecar_name: fleet-universal-apple-darwin
            cli_artifact: fleet-macos
            fixed_suffix: macos
            cache_key: desktop-macos

          - name: Windows (x64)
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc
            sidecar_name: fleet-x86_64-pc-windows-msvc.exe
            cli_artifact: fleet-windows-x64
            fixed_suffix: windows-x64
            cache_key: desktop-windows-x64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for toml in claw-fleet-core/Cargo.toml claw-fleet-desktop/Cargo.toml fleet-cli/Cargo.toml; do
            sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "$toml"
            rm -f "${toml}.bak"
          done

      # ── Toolchains ────────────────────────────────────────────────────────

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: claw-fleet-desktop/pnpm-lock.yaml

      - name: Setup protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # shared-key (not the per-job id) so the cache-warm job on main and
          # this tag-time job read/write the same key. GHA caches are scoped to
          # the creating ref + the default branch; since desktop builds only run
          # on tags, the warm cache populated on main is the only one a release
          # can restore. See the cache-warm job below.
          shared-key: ${{ matrix.cache_key }}

      # ── Build own-platform sidecar CLI (macOS / Windows) ──────────────────
      # Runs before the Tauri build so the shared target/ dir warms core for it.

      - name: Build sidecar CLI (macOS universal)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p claw-fleet-desktop/binaries dist
          cargo build --release -p fleet-cli --target aarch64-apple-darwin
          cargo build --release -p fleet-cli --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/fleet-cli \
            target/x86_64-apple-darwin/release/fleet-cli \
            -output "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}"
          chmod +x "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}"
          # tauri-action's universal build looks here for the lipo'd CLI too.
          mkdir -p target/universal-apple-darwin/release
          cp "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}" target/universal-apple-darwin/release/fleet-cli
          # Standalone CLI release artifact.
          cp "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}" "dist/${{ matrix.cli_artifact }}"

      - name: Build sidecar CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p claw-fleet-desktop/binaries dist
          cargo build --release -p fleet-cli --target ${{ matrix.rust_target }}
          cp "target/${{ matrix.rust_target }}/release/fleet-cli.exe" \
             "claw-fleet-desktop/binaries/${{ matrix.sidecar_name }}"
          cp "target/${{ matrix.rust_target }}/release/fleet-cli.exe" \
             "dist/${{ matrix.cli_artifact }}.exe"

      - name: Upload standalone CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/
          if-no-files-found: error

      # ── Download cross-platform binaries from cli-linux ───────────────────

      - name: Download Linux x64 probe
        uses: actions/download-artifact@v8
        with:
          name: fleet-linux-x64
          path: claw-fleet-desktop/resources

      - name: Download Linux arm64 probe
        uses: actions/download-artifact@v8
        with:
          name: fleet-linux-arm64
          path: claw-fleet-desktop/resources

      - name: Prepare sidecar and probes
        shell: bash
        run: |
          cd claw-fleet-desktop/binaries
          chmod +x "${{ matrix.sidecar_name }}" 2>/dev/null || true
          cd ../resources
          chmod +x fleet-linux-x64 fleet-linux-arm64

      # ── Build desktop app (unsigned) ──────────────────────────────────────

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: claw-fleet-desktop

      - name: Build Tauri app (unsigned)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ''
          OPENSSL_STATIC: '1'
        with:
          projectPath: claw-fleet-desktop
          args: ${{ matrix.tauri_args }}
          includeUpdaterJson: false

      # ── Collect unsigned artifacts ────────────────────────────────────────

      - name: Collect macOS .app (unsigned)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Tar to preserve permissions and symlinks across artifact transit.
          (cd "target/${{ matrix.rust_target }}/release/bundle/macos" && \
            tar -czf - "Claw Fleet.app") > "dist-artifacts/claw-fleet-${{ matrix.fixed_suffix }}.app.tar.gz"

      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find target/${{ matrix.rust_target }}/release/bundle/nsis \
            -name "*.exe" | head -1 | xargs -I{} cp {} dist-artifacts/claw-fleet-${{ matrix.fixed_suffix }}-setup.exe

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.fixed_suffix == 'macos' && 'desktop-macos-unsigned' || format('desktop-{0}', matrix.fixed_suffix) }}
          path: dist-artifacts/
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # main-branch only — warm the desktop Rust cache.
  #
  # The tag-time desktop-build jobs above otherwise run with a stone-cold cache:
  # GitHub Actions caches are readable only from the creating ref + the default
  # branch, and desktop-build runs *only* on tags, so each release recompiles
  # the entire dependency tree from scratch (~15 min of a ~22 min macOS build —
  # the workspace crates themselves are only ~2 min; the rest is deps).
  #
  # This job runs on main, compiles the same crates/targets/features with the
  # same env, and saves a Swatinem cache under the same `shared-key` the
  # desktop-build jobs restore from. A release tag cut from that main commit
  # then hits a warm dependency cache. It only does the expensive compile when
  # the dependency set (Cargo.lock / any Cargo.toml) changed, since that is the
  # only thing the cache preserves across the workspace recompile a tag does.
  #
  # NOTE: GHA evicts caches unused for 7 days. If no dependency change lands for
  # a week, the next release falls back to a cold build until the following dep
  # change re-warms it. Add a scheduled keep-alive trigger if that becomes a
  # problem.
  # ═══════════════════════════════════════════════════════════════════════════
  cache-warm:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    name: Warm cache — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            cache_key: desktop-macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            build: |
              cargo build --release -p fleet-cli --target aarch64-apple-darwin
              cargo build --release -p fleet-cli --target x86_64-apple-darwin
              OPENSSL_STATIC=1 cargo build --release -p claw-fleet-desktop --features vendored-ssl --target aarch64-apple-darwin
              OPENSSL_STATIC=1 cargo build --release -p claw-fleet-desktop --features vendored-ssl --target x86_64-apple-darwin

          - name: Windows (x64)
            runner: windows-latest
            cache_key: desktop-windows-x64
            targets: x86_64-pc-windows-msvc
            build: |
              cargo build --release -p fleet-cli --target x86_64-pc-windows-msvc
              cargo build --release -p claw-fleet-desktop --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect dependency changes
        # Only meaningful on push (needs a diff base). A manual workflow_dispatch
        # always warms — see the compile steps' conditions below.
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deps:
              - '**/Cargo.lock'
              - '**/Cargo.toml'

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: claw-fleet-desktop/pnpm-lock.yaml

      - name: Setup protoc
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Setup Rust
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache_key }}
          # Save on main even though cargo exits "successful with nothing to do"
          # on a warm cache — this also refreshes the cache's 7-day TTL.
          save-if: true

      # claw-fleet-desktop's tauri build script requires the frontend dist to
      # exist (frontendDist: ./dist), so build it before compiling the crate.
      - name: Build frontend
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true'
        working-directory: claw-fleet-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Warm dependency compilation
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.deps == 'true'
        shell: bash
        run: |
          ${{ matrix.build }}
