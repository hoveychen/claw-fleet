# 走 own-api-ko 的 fectun 隧道 + 受限 tinyproxy 下载，而不是直连 GitHub。
# 直连实测只有 10-40 KB/s（230 MB 要数小时）；经这条路 2.7 MB/s。
# selfhost.py / distribute.py 一行未改：urllib 自己认 https_proxy，连 302 到
# release-assets.githubusercontent.com 也一并走 CONNECT 隧道，所以
# validate_release() 对 github.com 的来源断言完全不受影响。
# 隧道断了会回落成连不上，下一轮 timer 重试；stage 跨轮保留所以不丢进度。
[Service]
Environment=https_proxy=http://127.0.0.1:18080
Environment=http_proxy=http://127.0.0.1:18080
