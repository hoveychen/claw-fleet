# Claw Fleet 镜像下载快路：只服务 fectun 隧道过来的本机流量，只放行 GitHub
# 发布链路的域名。深圳镜像直连 GitHub 只有 10-40 KB/s，经 ko 后 GitHub 侧
# 是 12 MB/s、ko->sz 隧道是 1.3 MB/s。见 docs/china-selfhost.md。
User tinyproxy
Group tinyproxy
Port 18080
Listen 127.0.0.1
Timeout 600
LogLevel Connect
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 20
# 只有本机（即 fectun server 转进来的）可用；不做任何对外暴露。
Allow 127.0.0.1
# 域名白名单：FilterDefaultDeny 让未列出的目标直接被拒。
Filter "/etc/tinyproxy/fleet-allow.txt"
FilterDefaultDeny Yes
FilterExtended On
# CONNECT 只允许 443，堵住把代理当通用跳板用。
ConnectPort 443
DisableViaHeader Yes
