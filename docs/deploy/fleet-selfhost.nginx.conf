server {
    listen 80;
    listen [::]:80;
    server_name fleet.eternizedlab.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fleet-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://fleet.eternizedlab.com$request_uri; }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name fleet.eternizedlab.com;
    ssl_certificate /etc/letsencrypt/live/fleet.eternizedlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.eternizedlab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/claw-fleet-site/current;
    index index.html;
    access_log /var/log/nginx/fleet-site.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # The site ships its own bilingual 404 (docs/404.html); without this the
    # mirror answers a mistyped URL with nginx's bare default page.
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }
    location = /downloads.json {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "https://hoveychen.github.io" always;
        add_header Vary "Origin" always;
        try_files $uri =404;
    }
    location ^~ /releases/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
